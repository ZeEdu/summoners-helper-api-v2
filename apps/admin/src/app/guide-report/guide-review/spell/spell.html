<div>
  <h2>{{title}}</h2>
  <div class="container" style="display: flex; gap: 8px">
    <div class="image-wrapper" style="display: flex; justify-content: center; align-items: flex-start;">
      <img width="64" height="64" style="border-radius: 8px;" [src]="thumbnail" />
    </div>
    <div class="description" style="flex: 1">
      <h3 style="margin-top: 0;">{{name}}</h3>
      <p>{{description}}</p>
    </div>
  </div>
</div>
