<h2>{{title}}</h2>
<div style="display: flex; gap: 8px;">
  <div style="display: flex; justify-content: center; align-items: start; padding: 0 16px;">
    <img width="48" height="48" style="border-radius: 8px;" [src]="thumbnail" />
  </div>
  <div style="flex: 1">
    <h2 style="margin-top: 0;">{{ name }}</h2>
    <p>{{ description }}</p>
  </div>
</div>
