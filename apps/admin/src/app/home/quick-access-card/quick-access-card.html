<mat-card class="card">
  <mat-card-content class="card-content">
    <div class="left">
      <mat-icon>
        {{leftIcon}}
      </mat-icon>
    </div>
    <div class="title">
      <mat-card-title>
        {{title}}
      </mat-card-title>
      <mat-card-subtitle>
        {{subtitle}}
      </mat-card-subtitle>
    </div>
    <div class="right">
      <mat-icon>
        {{rightIcon}}
      </mat-icon>
    </div>
  </mat-card-content>
</mat-card>
