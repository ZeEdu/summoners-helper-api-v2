<mat-drawer-container class="sidenav-container" autosize>
  <mat-drawer #drawer class="sidenav" mode="side">
    <mat-nav-list>
      <div mat-subheader>Denuncias</div>
      @for (route of routes; track route.link) {

      <a mat-list-item [routerLink]="route.link"
        (click)="$event.preventDefault(); activeLink.set(route.link); drawer.close()"
        [activated]="activeLink() === route.link">
        <mat-icon matListItemIcon>{{route.icon}}</mat-icon>
        {{route.title | titlecase}}
      </a>
      }
    </mat-nav-list>
  </mat-drawer>
  <div class="content">
    @if (showToolbar()) {
    <mat-toolbar>
      <button matIconButton (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Painel Administrativo</span>
      <span class="separator"></span>
      <button matButton="filled" (click)="confirmUserLogoutIntention()">
        Sair
      </button>
    </mat-toolbar>
    }
    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
</mat-drawer-container>
