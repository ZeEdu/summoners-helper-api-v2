<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <span class="title">
          Runa Principal - {{mainRuneName}}
        </span>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content class="card-content">
      <app-rune-slot [runeSlotId]="guide.primarySlots.first" />
      <mat-divider />
      <app-rune-slot [runeSlotId]="guide.primarySlots.second" />
      <mat-divider />
      <app-rune-slot [runeSlotId]="guide.primarySlots.third" />
      <mat-divider />
      <app-rune-slot [runeSlotId]="guide.primarySlots.fourth!" />
      <mat-divider />
      <p>
        {{guide.primaryRuneDescription}}
      </p>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-header>
      <mat-card-title>
        Runa Secondária - {{mainRuneName}}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content class="card-content">
      <app-rune-slot [runeSlotId]="guide.secondarySlots.first" />
      <mat-divider />
      <app-rune-slot [runeSlotId]="guide.secondarySlots.second" />
      <mat-divider />
      <app-rune-slot [runeSlotId]="guide.secondarySlots.third" />
      <mat-divider />
      <p>
        {{guide.primaryRuneDescription}}
      </p>
    </mat-card-content>
  </mat-card>
</div>
