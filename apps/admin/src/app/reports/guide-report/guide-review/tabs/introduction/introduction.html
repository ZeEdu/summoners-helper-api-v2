<div class="container">
  <mat-card class="introduction">
    <mat-card-header>
      <mat-card-title>
        Introdução
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>
        {{guide.introduction}}
      </p>
    </mat-card-content>
  </mat-card>
  <mat-card class="side" appearance="filled">
    <mat-card-header>
      <mat-card-title>
        Resumo do guia
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="card-content">
        <div class="section">
          <div>
            <mat-icon class="icon">shield</mat-icon>
          </div>
          <div class="info">
            <h3 class="title">
              Campeão
            </h3>
            <p class="subtitle">
              {{guide.champion | entityName : 'champions'}}
            </p>
          </div>
        </div>

        <div class="section">
          <div class="icon-wrapper">
            <mat-icon class="icon">alt_route</mat-icon>
          </div>
          <div class="info">
            <h3 class="title">
              Role
            </h3>
            <p class="subtitle">
              {{guide.role | roleName }}
            </p>
          </div>
        </div>

        <div class="section">
          <div class="icon-wrapper">
            <mat-icon class="icon">update</mat-icon>
          </div>
          <div class="info">
            <h3 class="title">
              Patch
            </h3>
            <p class="subtitle">
              {{guide.patchVersion }}
            </p>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

</div>
